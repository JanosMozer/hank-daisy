# Local configuration for Hank Daisy project
# This file is not committed to git - add your own local settings here

# Meta Wearables Device Access Toolkit credentials
# Get these from https://wearables.developer.meta.com/
mwdat_application_id=
mwdat_client_token=

# OpenRouter API key for vision/text LLM
# Get one at https://openrouter.ai/
openrouter_api_key=

# ElevenLabs TTS API key (optional)
# Get one at https://elevenlabs.io/
# If not set, falls back to Android TTS
elevenlabs_api_key=
elevenlabs_voice_id=

# Hank agent server URL
# The Python agent server running agent/server.py
# Local: ws://localhost:8765
# On same WiFi: ws://192.168.X.X:8765 (replace with your machine's IP)
# Default (Android emulator to host): ws://10.0.2.2:8765
hank_agent_url=ws://10.0.2.2:8765
